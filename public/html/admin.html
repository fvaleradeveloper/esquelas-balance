<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración SAAS - Esquelas-Balance</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="main-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">🏢 SAAS Admin</div>
      <ul class="sidebar-nav">
        <li><a href="admin.html" class="active"><span>📊</span> Dashboard SAAS</a></li>
        <li><a href="login.html" id="logoutLink" style="color:var(--color-danger);"><span>🚪</span> Cerrar Sesión</a></li>
      </ul>
    </aside>

    <div class="main-content">
      <div class="page-header">
        <h1>🏢 Administración de Tenants (SAAS)</h1>
        <p>Gestione los condominios (tenants) registrados en el sistema.</p>
      </div>

      <div id="alert-container"></div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Lista de Tenants</div>
          <button class="btn btn-success" onclick="openTenantModal()">+ Agregar Tenant</button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th>Fecha Registro</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tenantsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Agregar/Editar Tenant -->
  <div class="modal" id="tenantModal">
    <div class="modal-content" style="max-width:500px;">
      <div class="modal-header">
        <div class="modal-title" id="tenantModalTitle">Agregar Tenant</div>
        <button class="close-modal" onclick="closeModal('tenantModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="tenantAlert"></div>
        <form id="tenantForm">
          <input type="hidden" id="tenantId">
          <div class="form-group">
            <label class="form-label">Nombre completo</label>
            <input type="text" id="tName" class="form-input" placeholder="Condominio Las Brisas" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="tEmail" class="form-input" placeholder="admin@condominio.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Teléfono</label>
            <input type="tel" id="tPhone" class="form-input" placeholder="+51 999 999 999">
          </div>
          <div class="form-group" id="tenantPasswordGroup">
            <label class="form-label">Contraseña</label>
            <input type="password" id="tPassword" class="form-input" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label class="form-label">Estado</label>
            <select id="tStatus" class="form-select">
              <option value="active">Activo</option>
              <option value="inactivo">Inactivo</option>
              <option value="deleted">Eliminado</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('tenantModal')">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="saveTenant()">Guardar Tenant</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    const token = getToken();
    if (!token) window.location.href = 'login.html';

    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.role !== 'saas_admin') {
      window.location.href = 'owners.html';
    }

    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      logout();
    });

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('show');
    }

    function openTenantModal() {
      document.getElementById('tenantForm').reset();
      document.getElementById('tenantId').value = '';
      document.getElementById('tenantModalTitle').textContent = 'Agregar Tenant';
      document.getElementById('tenantAlert').innerHTML = '';
      document.getElementById('tenantModal').classList.add('show');
    }

    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('show');
      });
    });

    loadTenants();
  </script>
</body>
</html>
