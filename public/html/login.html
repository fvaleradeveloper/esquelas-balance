<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Esquelas-Balance</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="main-layout">
    <div class="main-content" style="margin-left:0; padding:0; min-height:100vh; display:flex; align-items:center; justify-content:center;">
      <div class="card" style="max-width:420px; width:100%; margin:20px;">
        <div style="text-align:center; margin-bottom:24px;">
          <div style="font-size:32px; margin-bottom:12px;">🧾</div>
          <h2 style="color:var(--color-primary-dark); font-size:24px;">Esquelas-Balance</h2>
          <p style="color:var(--color-text-light); font-size:14px;">Inicie sesión para gestionar sus recibos y balance</p>
        </div>

        <div id="alert-container"></div>

        <form id="loginForm" style="padding:0 24px 24px;">
          <div class="form-group">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-input" placeholder="correo@ejemplo.com" required>
          </div>

          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Iniciar Sesión</button>
        </form>

        <div style="padding:0 24px 24px; text-align:center;">
          <p style="color:var(--color-text-light); font-size:14px; margin-bottom:16px;">¿No tiene cuenta?</p>
          <a href="register.html" class="btn btn-outline" style="width:100%;">Crear cuenta gratuita</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const alertContainer = document.getElementById('alert-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertContainer.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error al iniciar sesión');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Redirigir según rol
        const role = data.user.role;
        if (role === 'saas_admin') {
          window.location.href = 'admin.html';
        } else if (role === 'tenant') {
          window.location.href = 'owners.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        const safe = String(err.message || 'Error').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        alertContainer.innerHTML = `<div class="alert alert-error">${safe}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
