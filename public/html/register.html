<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Esquelas-Balance</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="main-layout">
    <div class="main-content" style="margin-left:0; padding:0; min-height:100vh; display:flex; align-items:center; justify-content:center;">
      <div class="card" style="max-width:460px; width:100%; margin:20px;">
        <div style="text-align:center; margin-bottom:24px;">
          <div style="font-size:32px; margin-bottom:12px;">📝</div>
          <h2 style="color:var(--color-primary-dark); font-size:24px;">Crear Cuenta</h2>
          <p style="color:var(--color-text-light); font-size:14px;">Comience a gestionar sus esquelas y balance</p>
        </div>

        <div id="alert-container"></div>

        <form id="registerForm" style="padding:0 24px 24px;">
          <div class="form-group">
            <label class="form-label">Nombre completo</label>
            <input type="text" id="name" class="form-input" placeholder="Carlos Mendoza" required>
          </div>

          <div class="form-group">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-input" placeholder="correo@ejemplo.com" required>
          </div>

          <div class="form-group">
            <label class="form-label">Teléfono (opcional)</label>
            <input type="tel" id="phone" class="form-input" placeholder="+51 999 999 999">
          </div>

          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;" id="registerBtn">Registrarse</button>
        </form>

        <div style="padding:0 24px 24px; text-align:center;">
          <p style="color:var(--color-text-light); font-size:14px; margin-bottom:16px;">¿Ya tiene cuenta?</p>
          <a href="login.html" class="btn btn-outline" style="width:100%;">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const btn = document.getElementById('registerBtn');
    const alertContainer = document.getElementById('alert-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertContainer.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Registrando...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error al registrarse');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        alertContainer.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Registrarse';
      }
    });
  </script>
</body>
</html>
